<!doctype html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport"
          content="width=device-width, user-scalable=no, initial-scale=1.0, maximum-scale=1.0, minimum-scale=1.0">
    <meta http-equiv="X-UA-Compatible" content="ie=edge">
    <title>Cross Words Highlight</title>
    <link rel="stylesheet" href="theme/chrome/css/config-page.css">
    <script src="theme/chrome/js/config.js" defer></script>
</head>
<body>
<div id="app">
    <div class="config-shell">
        <header class="config-topbar" id="config-topbar">
            <div class="config-topbar-copy" id="page-title-wrap" hidden>
                <h1 class="config-topbar-title" id="page-title"></h1>
            </div>

            <label class="field-shell table-search" for="search-input">
                <span class="field-icon" aria-hidden="true"></span>
                <input id="search-input" class="field-input" type="search" autocomplete="off">
                <button id="search-clear" class="field-clear" type="button">×</button>
            </label>
        </header>

        <section class="panel-card panel-card-library">
            <div class="panel-card-header">
                <div>
                    <h2 class="panel-card-title" id="library-title"></h2>
                </div>

                <div class="header-actions" id="header-transfer-control">
                    <button type="button" class="header-action-button" data-role="export-button"></button>
                    <button type="button" class="header-action-button" data-role="import-button"></button>
                </div>
            </div>

            <div class="table-frame" id="table-frame">
                <table class="config-table" id="config-table">
                    <thead>
                    <tr>
                        <th class="col-source" id="source-header"></th>
                        <th class="col-readdate">
                            <button class="sort-button" id="saved-at-sort" type="button">
                                <span id="saved-at-label"></span>
                                <span class="sort-indicator" id="saved-at-sort-indicator"></span>
                            </button>
                        </th>
                        <th class="col-actions" id="actions-header"></th>
                    </tr>
                    </thead>
                    <tbody id="table-body"></tbody>
                </table>

                <div class="empty-state" id="table-empty"></div>
            </div>

            <div class="panel-card-footer" id="panel-footer">
                <div class="config-dock config-dock-inline" id="inline-dock">
                    <div class="dock-control dock-language" id="inline-language-control">
                        <button type="button" data-language="zh">中</button>
                        <button type="button" data-language="en">EN</button>
                    </div>

                    <label class="dock-control dock-switch" id="inline-switch-control">
                        <span class="dock-status-dot"></span>
                        <span class="switch-shell">
                            <input class="switch-input" type="checkbox" data-role="extension-switch">
                            <span class="switch-track">
                                <span class="switch-thumb"></span>
                            </span>
                        </span>
                    </label>
                </div>

                <div class="pagination-group" id="pagination-group">
                    <span class="pagination-total" id="pagination-total"></span>

                    <label class="page-size-box" for="page-size-select">
                        <select class="page-size-select" id="page-size-select"></select>
                    </label>

                    <div class="pagination-nav">
                        <button class="pagination-arrow" id="prev-page-button" type="button">‹</button>
                        <div class="page-number-list" id="page-number-list"></div>
                        <button class="pagination-arrow" id="next-page-button" type="button">›</button>
                    </div>

                    <form class="pagination-jumper" id="pagination-jumper-form">
                        <span id="pagination-jumper-prefix"></span>
                        <input class="pagination-jumper-input" id="pagination-jumper-input" type="number" min="1" step="1">
                        <span id="pagination-jumper-suffix"></span>
                    </form>
                </div>
            </div>
        </section>

        <div class="config-dock" id="page-dock">
            <div class="dock-control dock-language" id="page-language-control">
                <button type="button" data-language="zh">中</button>
                <button type="button" data-language="en">EN</button>
            </div>

            <label class="dock-control dock-switch" id="page-switch-control">
                <span class="dock-status-dot"></span>
                <span class="switch-shell">
                    <input class="switch-input" type="checkbox" data-role="extension-switch">
                    <span class="switch-track">
                        <span class="switch-thumb"></span>
                    </span>
                </span>
            </label>
        </div>
    </div>

    <input id="import-file-input" type="file" accept="application/json,.json" hidden>
    <div class="detail-modal" id="detail-modal" hidden>
        <div class="detail-dialog" role="dialog" aria-modal="true" aria-labelledby="detail-dialog-title">
            <button class="dialog-close" id="detail-close-icon" type="button" aria-label="Close">×</button>

            <div class="detail-header">
                <h2 class="detail-dialog-title" id="detail-dialog-title"></h2>
                <p class="detail-dialog-link" id="detail-dialog-link"></p>
            </div>

            <div class="detail-toolbar">
                <label class="field-shell detail-search" for="detail-search-input">
                    <span class="field-icon" aria-hidden="true"></span>
                    <input id="detail-search-input" class="field-input" type="search" autocomplete="off">
                    <button id="detail-search-clear" class="field-clear" type="button">×</button>
                </label>
            </div>

            <div class="detail-table-frame" id="detail-table-frame">
                <table class="detail-table">
                    <thead>
                    <tr>
                        <th class="detail-col-excerpt" id="detail-excerpt-header"></th>
                        <th class="detail-col-note" id="detail-note-header"></th>
                        <th class="detail-col-color" id="detail-color-header"></th>
                        <th class="detail-col-actions" id="detail-actions-header"></th>
                    </tr>
                    </thead>
                    <tbody id="detail-table-body"></tbody>
                </table>

                <div class="empty-state" id="detail-empty"></div>
            </div>

            <div class="dialog-footer">
                <button class="secondary-button" id="detail-close-button" type="button"></button>
            </div>
        </div>
    </div>

    <div class="toast-stack" id="toast-stack"></div>
</div>
</body>
</html>
