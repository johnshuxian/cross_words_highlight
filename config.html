<!doctype html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport"
          content="width=device-width, user-scalable=no, initial-scale=1.0, maximum-scale=1.0, minimum-scale=1.0">
    <meta http-equiv="X-UA-Compatible" content="ie=edge">
    <title>Cross Words Highlight</title>
    <link rel="stylesheet" href="theme/chrome/css/element-ui-index.css">
    <link rel="stylesheet" href="theme/chrome/css/config-page.css">
    <script src="theme/chrome/js/vue.js"></script>
    <script src="theme/chrome/js/element-ui-index.js"></script>
    <script src="theme/chrome/js/config.js"></script>
</head>
<body>
<div id="app">
    <template>
        <div class="config-shell">
            <header class="config-topbar">
                <div class="config-topbar-copy">
                    <h1 class="config-topbar-title">{{ uiText.pageTitle }}</h1>
                </div>

                <el-input
                        v-model="search"
                        class="table-search"
                        clearable
                        prefix-icon="el-icon-search"
                        :placeholder="uiText.searchPlaceholder">
                </el-input>
            </header>

            <section class="panel-card panel-card-library">
                <div class="panel-card-header">
                    <div>
                        <h2 class="panel-card-title">{{ uiText.libraryTitle }}</h2>
                    </div>
                </div>

                <el-table
                        class="config-table"
                        :data="tableData"
                        :height="tableHeight"
                        :default-sort="{prop: 'readDate', order: 'descending'}"
                        :empty-text="uiText.emptyState"
                        @sort-change="changeSort"
                        v-loading="loading">
                    <el-table-column
                            :label="uiText.sourceColumn"
                            :min-width="pageMode === 'popup' ? 430 : 620">
                        <template slot-scope="scope">
                            <div class="source-cell">
                                <el-avatar
                                        class="source-avatar"
                                        size="large"
                                        :title="scope.row.href"
                                        @error="errorHandler"
                                        :key="scope.row.key"
                                        shape="square"
                                        fit="scale-down"
                                        :src="scope.row.icon">
                                    {{ getHostInitial(scope.row.href) }}
                                </el-avatar>
                                <div class="source-copy">
                                    <div class="source-title">{{ scope.row.title || getReadableHost(scope.row.href) }}</div>
                                    <div class="source-meta-line">
                                        <span class="source-host">{{ getReadableHost(scope.row.href) }}</span>
                                        <span class="source-meta-group">
                                            <span class="source-meta-chip">
                                                {{ uiText.highlightMetaLabel }} {{ scope.row.nums }}
                                            </span>
                                            <span class="source-meta-chip">
                                                {{ uiText.noteMetaLabel }} {{ scope.row.commentNums }}
                                            </span>
                                        </span>
                                    </div>
                                </div>
                            </div>
                        </template>
                    </el-table-column>

                    <el-table-column
                            prop="readDate"
                            sortable="custom"
                            :width="pageMode === 'popup' ? 124 : 180"
                            :label="uiText.savedAtColumn">
                        <template slot-scope="scope">
                            <span class="timestamp-text">{{ formatReadDate(scope.row.readDate) }}</span>
                        </template>
                    </el-table-column>

                    <el-table-column
                            :label="uiText.actionsColumn"
                            :width="pageMode === 'popup' ? 138 : 210"
                            align="right">
                        <template slot-scope="scope">
                            <div class="action-group">
                                <el-button @click="openUrl(scope.row.href)" type="text" size="small">
                                    {{ uiText.readAction }}
                                </el-button>
                                <el-button @click="getDetail(scope.row)" type="text" size="small">
                                    {{ uiText.detailAction }}
                                </el-button>
                                <el-button @click="del(scope.row)" class="is-danger" type="text" size="small">
                                    {{ uiText.deleteAction }}
                                </el-button>
                            </div>
                        </template>
                    </el-table-column>
                </el-table>

                <div v-if="shouldShowBottomBar"
                     class="panel-card-footer"
                     :class="{ 'panel-card-footer-with-dock': pageMode === 'popup' }">
                    <div v-if="pageMode === 'popup'" class="config-dock config-dock-inline">
                        <div class="dock-control dock-language" :title="uiText.languageLabel">
                            <button type="button"
                                    :class="{ 'is-active': uiLanguage === 'zh' }"
                                    @click="changeLanguage('zh')">
                                中
                            </button>
                            <button type="button"
                                    :class="{ 'is-active': uiLanguage === 'en' }"
                                    @click="changeLanguage('en')">
                                EN
                            </button>
                        </div>

                        <div class="dock-control dock-switch" :title="uiText.extensionStatusLabel">
                            <span class="dock-status-dot" :class="{ 'is-active': extensionSettings.use }"></span>
                            <el-switch
                                    v-model="extensionSettings.use"
                                    @change="statusChange">
                            </el-switch>
                        </div>
                    </div>

                    <el-pagination
                            v-if="shouldShowPaginationFooter"
                            class="config-pagination"
                            :small="pageMode === 'popup'"
                            @next-click="handleNextClick"
                            @prev-click="handlePrevClick"
                            @size-change="handleSizeChange"
                            @current-change="handleCurrentChange"
                            :current-page="currentPage"
                            :page-sizes="paginationPageSizes"
                            :page-size="pageSize"
                            :layout="paginationLayout"
                            :total="tableDataLength">
                    </el-pagination>
                </div>
            </section>

            <div v-if="pageMode !== 'popup'" class="config-dock">
                <div class="dock-control dock-language" :title="uiText.languageLabel">
                    <button type="button"
                            :class="{ 'is-active': uiLanguage === 'zh' }"
                            @click="changeLanguage('zh')">
                        中
                    </button>
                    <button type="button"
                            :class="{ 'is-active': uiLanguage === 'en' }"
                            @click="changeLanguage('en')">
                        EN
                    </button>
                </div>

                <div class="dock-control dock-switch" :title="uiText.extensionStatusLabel">
                    <span class="dock-status-dot" :class="{ 'is-active': extensionSettings.use }"></span>
                    <el-switch
                            v-model="extensionSettings.use"
                            @change="statusChange">
                    </el-switch>
                </div>
            </div>

            <el-dialog
                    custom-class="detail-dialog"
                    :title="uiText.detailDialogTitle"
                    :width="pageMode === 'popup' ? '96%' : '92%'"
                    top="5vh"
                    :close-on-click-modal="false"
                    :visible.sync="dialogTableVisible"
                    @close="closeDialog">
                <div class="detail-toolbar">
                    <div>
                        <h3>{{ activeDetailTitle || uiText.detailDialogTitle }}</h3>
                        <p>{{ activeDetailHref }}</p>
                    </div>

                    <el-input
                            v-model="detailSearch"
                            class="detail-search"
                            clearable
                            prefix-icon="el-icon-search"
                            :placeholder="uiText.detailSearchPlaceholder">
                    </el-input>
                </div>

                <el-table
                        class="config-table"
                        :border="false"
                        :data="filteredGridData"
                        :empty-text="uiText.detailEmptyState"
                        :row-class-name="tableRowClassName"
                        :max-height="pageMode === 'popup' ? 420 : 520">
                    <el-table-column
                            :show-overflow-tooltip="true"
                            :min-width="pageMode === 'popup' ? 210 : 300"
                            :label="uiText.excerptColumn">
                        <template slot-scope="scope">
                            <el-button type="text"
                                       class="detail-excerpt"
                                       :title="scope.row.text"
                                       @click="open(scope.row.text)">
                                <span class="detail-text-clamp">{{ scope.row.text }}</span>
                            </el-button>
                        </template>
                    </el-table-column>

                    <el-table-column
                            :show-overflow-tooltip="true"
                            :min-width="pageMode === 'popup' ? 150 : 240"
                            :label="uiText.noteColumn">
                        <template slot-scope="scope">
                            <div class="detail-comment-cell" @dblclick.stop="startCommentEdit(scope.row)">
                                <el-input
                                        v-if="editingCommentId === scope.row.id"
                                        v-model="editingCommentDraft"
                                        ref="detailCommentEditor"
                                        type="textarea"
                                        :autosize="{ minRows: 2, maxRows: 4 }"
                                        class="detail-comment-editor"
                                        :disabled="savingCommentId === scope.row.id"
                                        :placeholder="uiText.noteEditorPlaceholder"
                                        @blur="saveCommentEdit(scope.row)"
                                        @keydown.native.esc.stop.prevent="cancelCommentEdit">
                                </el-input>
                                <span v-else
                                      class="detail-comment-view"
                                      :title="scope.row.comment || uiText.noNoteText"
                                      :class="{ 'is-empty': !scope.row.comment }"
                                      >
                                    {{ scope.row.comment || uiText.noNoteText }}
                                </span>
                            </div>
                        </template>
                    </el-table-column>

                    <el-table-column
                            :width="pageMode === 'popup' ? 52 : 70"
                            :label="uiText.colorColumn">
                        <template slot-scope="scope">
                            <span class="detail-color-chip">
                                <span class="detail-color-dot" :style="{ background: getHighlightColorHex(scope.row.color) }"></span>
                            </span>
                        </template>
                    </el-table-column>

                    <el-table-column
                            align="right"
                            :width="pageMode === 'popup' ? 78 : 120"
                            :label="uiText.actionsColumn">
                        <template slot-scope="scope">
                            <el-button type="text" class="is-danger" @click="delDetail(scope.row)" size="small">
                                {{ uiText.deleteAction }}
                            </el-button>
                        </template>
                    </el-table-column>
                </el-table>

                <div slot="footer" class="dialog-footer">
                    <el-button @click="dialogTableVisible = false">{{ uiText.closeAction }}</el-button>
                </div>
            </el-dialog>
        </div>
    </template>
</div>
</body>
</html>
